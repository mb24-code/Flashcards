<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; }
        .card { width: 320px; height: 200px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white; text-align: center; }
        .back { transform: rotateY(180deg); background: #002d62; color: white; }
    </style>
</head>
<body>

<div class="card" onclick="this.classList.toggle('flipped')">
    <div class="card-inner">
        <div class="front"><strong>Where is Special Collections?</strong></div>
        <div class="back">Sawyer Library, Level 4 (Chapin Library)</div>
    </div>
</div>

</body>
</html>
