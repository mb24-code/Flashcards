<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            width: 100%;            /* Fills full width of iframe */
            max-width: 850px;       /* Expanded maximum card width */
            height: 400px;          /* Increased vertical height */
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .card.flipped .card-inner { 
            transform: rotateY(180deg); 
        }

        .front, .back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12); 
            text-align: center; 
            
            /* Text sizing directly on card faces */
            font-size: 2rem;        /* Large text size (~32px) */
            font-weight: 600;
            line-height: 1.4;
        }

        .front {
            background-color: #ffffff;
            color: #111827;
            border: 2px solid #e5e7eb;
        }

        .back { 
            transform: rotateY(180deg); 
            background-color: #002d62; 
            color: #ffffff; 
        }
    </style>
</head>
<body>

<div class="card" onclick="this.classList.toggle('flipped')">
    <div class="card-inner">
        <div class="front">Where is Special Collections?</div>
        <div class="back">Sawyer Library, Level 4 (Chapin Library)</div>
    </div>
</div>

</body>
</html>
